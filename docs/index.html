<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Film Scan Frame Splitter</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #30251f;
      --muted: #796b61;
      --line: #d8c9bb;
      --line-strong: #bda997;
      --panel: #eee4d9;
      --paper: #fbf7f1;
      --cream: #f4ecdf;
      --accent: #9b5336;
      --accent-strong: #793c28;
      --caramel: #c28a5c;
      --cocoa: #4a3429;
      --green: #61705a;
      --focus: #9b5336;
      --shadow: 0 18px 46px rgba(68, 43, 29, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 4%, rgba(194, 138, 92, 0.18), transparent 30rem),
        #e9dfd4;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(300px, 340px) minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }

    aside {
      border-right: 1px solid var(--line);
      background: rgba(251, 247, 241, 0.97);
      padding: 22px;
      overflow-y: auto;
      min-height: 0;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      box-shadow: 12px 0 40px rgba(68, 43, 29, 0.06);
      z-index: 1;
    }

    main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    header {
      border-bottom: 1px solid var(--line);
      padding: 17px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(251, 247, 241, 0.9);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 780;
      letter-spacing: -0.035em;
    }

    h2 {
      margin: 22px 0 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      border-radius: 11px;
      background: var(--cocoa);
      box-shadow: 0 10px 22px rgba(68, 43, 29, 0.22);
      position: relative;
    }

    .brand-mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .control {
      margin: 10px 0;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--cocoa);
      margin-bottom: 6px;
      font-weight: 650;
    }

    input[type="file"],
    input[type="number"],
    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 8px;
      color: var(--ink);
      padding: 9px 11px;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    input:hover,
    select:hover {
      border-color: var(--line-strong);
      background: #fff;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    input:focus,
    select:focus,
    button:focus {
      outline: none;
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(155, 83, 54, 0.14);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 249, 0.9);
      border-radius: 8px;
      color: var(--ink);
      cursor: pointer;
      font-weight: 720;
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(68, 43, 29, 0.10);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 7px 16px rgba(121, 60, 40, 0.20);
    }

    button.primary:hover {
      background: var(--accent-strong);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 430px);
      min-height: 0;
      overflow: hidden;
    }

    .preview-wrap {
      position: relative;
      overflow: auto;
      min-height: 0;
      overscroll-behavior: contain;
      scrollbar-gutter: stable both-edges;
      background-color: #d9cec2;
      background-image:
        linear-gradient(45deg, rgba(74, 52, 41, 0.035) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(74, 52, 41, 0.035) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(74, 52, 41, 0.035) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(74, 52, 41, 0.035) 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      min-width: 0;
      display: grid;
      place-items: start center;
      padding: 20px;
    }

    .preview-wrap:has(.empty:not([hidden])) {
      place-items: stretch;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      background: #fff;
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    canvas[hidden] {
      display: none;
    }

    .empty {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 1.5px dashed var(--line-strong);
      border-radius: 16px;
      background: rgba(251, 247, 241, 0.9);
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(68, 43, 29, 0.08);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .empty[hidden] {
      display: none;
    }

    .empty:hover,
    .preview-wrap.is-dragging .empty {
      border-color: var(--accent);
      background: var(--paper);
      transform: translateY(-2px);
    }

    .empty-content {
      max-width: 360px;
    }

    .empty-icon {
      display: block;
      width: 68px;
      height: 56px;
      margin: 0 auto 14px;
    }

    .empty strong {
      display: block;
      color: var(--ink);
      font-size: 17px;
      margin-bottom: 7px;
    }

    .editor {
      border-left: 1px solid var(--line);
      padding: 22px;
      overflow: auto;
      min-height: 0;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      background: rgba(251, 247, 241, 0.98);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 8px 22px rgba(68, 43, 29, 0.06);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 640px;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 7px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tr.selected td {
      background: #f2e2d3;
    }

    td input[type="number"] {
      width: 78px;
      min-height: 30px;
      padding: 4px 6px;
    }

    td button {
      min-height: 30px;
      padding: 2px 8px;
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 12px;
    }

    .inspector {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      box-shadow: 0 8px 22px rgba(68, 43, 29, 0.06);
      overflow: hidden;
    }

    .inspector-empty {
      min-height: 220px;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .inspector-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .inspector-head h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -0.01em;
    }

    .crop-editor {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(45deg, rgba(74, 52, 41, 0.04) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(74, 52, 41, 0.04) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(74, 52, 41, 0.04) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(74, 52, 41, 0.04) 75%),
        #e7ddd2;
      background-size: 18px 18px;
      background-position: 0 0, 0 9px, 9px -9px, -9px 0;
    }

    .crop-editor canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 2;
      border-radius: 9px;
      background: var(--cocoa);
      box-shadow: 0 8px 20px rgba(68, 43, 29, 0.16);
      cursor: crosshair;
      touch-action: none;
    }

    .crop-editor-help {
      margin: 9px 2px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
    }

    .enabled-control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-size: 12px;
    }

    .inspector-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 18px;
    }

    .inspector-field {
      margin: 0;
    }

    .inspector-field input {
      width: 100%;
    }

    .inspector-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 18px 18px;
    }

    .inspector-actions .delete {
      grid-column: 1 / -1;
      color: var(--accent-strong);
      border-color: rgba(155, 83, 54, 0.35);
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff;
    }

    .header-title {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .header-icon {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      margin-top: 1px;
      position: relative;
    }

    .header-icon::before {
      content: "";
      position: absolute;
      inset: 2px;
      background:
        linear-gradient(var(--accent), var(--accent)) left top / 10px 2px no-repeat,
        linear-gradient(var(--accent), var(--accent)) left top / 2px 10px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right top / 10px 2px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right top / 2px 10px no-repeat,
        linear-gradient(var(--accent), var(--accent)) left bottom / 10px 2px no-repeat,
        linear-gradient(var(--accent), var(--accent)) left bottom / 2px 10px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right bottom / 10px 2px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right bottom / 2px 10px no-repeat;
    }

    .header-icon::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      left: 13px;
      top: 13px;
      border-radius: 50%;
      background: var(--cocoa);
    }

    .status {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-icon {
      width: 18px;
      height: 14px;
      border: 2px solid var(--accent);
      border-radius: 4px;
      display: inline-block;
      position: relative;
    }

    .section-icon::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      left: 5px;
      top: 3px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
    }

    .section-icon.film {
      border-radius: 2px;
      background: repeating-linear-gradient(90deg, transparent 0 3px, var(--accent) 3px 5px);
    }

    .section-icon.film::after {
      display: none;
    }

    .section-icon.export {
      border-width: 0 0 2px;
      border-radius: 0;
    }

    .section-icon.export::after {
      width: 7px;
      height: 7px;
      left: 4px;
      top: -1px;
      border: 0;
      border-right: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      border-radius: 0;
      transform: rotate(45deg);
    }

    .replace-control {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--cocoa);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #fileInput {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .download {
      display: none;
      margin-top: 12px;
      color: var(--green);
      font-weight: 720;
      text-decoration: none;
    }

    .notice {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      min-height: 38px;
    }

    @media (max-width: 1050px) {
      body {
        overflow: auto;
      }

      .app,
      .workspace {
        grid-template-columns: 1fr;
      }

      .app {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      aside,
      .editor {
        border: 0;
        border-bottom: 1px solid var(--line);
        overflow: visible;
      }

      main {
        display: block;
        overflow: visible;
      }

      aside {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <path d="M8 25a7 7 0 0 1 7-7h9l4-7h12l4 7h5a7 7 0 0 1 7 7v22a7 7 0 0 1-7 7H15a7 7 0 0 1-7-7Z" fill="#f4ecdf"/>
            <circle cx="33" cy="36" r="12" fill="#4a3429"/>
            <circle cx="33" cy="36" r="7" fill="#c28a5c"/>
            <circle cx="30" cy="33" r="2" fill="#f4ecdf"/>
            <circle cx="49" cy="26" r="2.5" fill="#9b5336"/>
          </svg>
        </span>
        <div>
          <h1>Frame Splitter</h1>
          <small>Film scan crop studio</small>
        </div>
      </div>

      <input id="fileInput" type="file" accept="image/*,.tif,.tiff">

      <h2 class="section-title"><span class="section-icon film" aria-hidden="true"></span>Detection</h2>
      <div class="control">
        <label for="aspect">Crop mode</label>
        <select id="aspect">
          <option value="smart-auto">Auto</option>
          <option value="smart-landscape">Half Frame 2:3</option>
          <option value="smart-portrait">Full Frame 3:2</option>
        </select>
      </div>
      <div class="row">
        <div class="control">
          <label for="orientation">Strip direction</label>
          <select id="orientation">
            <option value="auto">Auto</option>
            <option value="horizontal">Horizontal</option>
            <option value="vertical">Vertical</option>
          </select>
        </div>
        <div class="control">
          <label for="lanes">Parallel lanes</label>
          <select id="lanes">
            <option value="auto">Auto</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="control">
          <label for="frames">Frames per lane</label>
          <input id="frames" type="number" min="0" max="80" value="0">
        </div>
        <div class="control">
          <label for="padding">Padding %</label>
          <input id="padding" type="number" min="-10" max="20" step="0.5" value="0">
        </div>
      </div>
      <div class="control">
        <label for="rowGap">Row gap safety %</label>
        <input id="rowGap" type="number" min="2" max="20" step="1" value="8">
      </div>
      <div class="control">
        <label for="boundarySensitivity">Boundary sensitivity %</label>
        <input id="boundarySensitivity" type="number" min="70" max="95" step="1" value="82">
      </div>

      <h2 class="section-title"><span class="section-icon export" aria-hidden="true"></span>Export</h2>
      <div class="control">
        <label for="format">Format</label>
        <select id="format">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPEG</option>
        </select>
      </div>

      <div class="actions">
        <button id="detectBtn" class="primary" disabled>Detect frames</button>
        <button id="addBtn" disabled>Add box</button>
        <button id="exportBtn" class="primary" disabled>Export ZIP</button>
        <button id="resetBtn" disabled>Reset</button>
      </div>

      <a id="downloadLink" class="download" download="film_frames.zip">Download ZIP</a>
      <p class="notice" id="message">Upload a film scan to begin.</p>
    </aside>

    <main>
      <header>
        <div class="header-title">
          <span class="header-icon" aria-hidden="true"></span>
          <div>
            <h1>Crop Preview</h1>
            <div class="notice">Review every frame before exporting the full-resolution set.</div>
          </div>
        </div>
        <div>
          <label class="replace-control" for="fileInput">Choose scan</label>
          <div class="status" id="status">No image loaded</div>
        </div>
      </header>

      <section class="workspace">
        <div class="preview-wrap">
          <label class="empty" id="emptyState" for="fileInput">
            <div class="empty-content">
              <svg class="empty-icon" viewBox="0 0 72 60" aria-hidden="true">
                <path d="M8 24a8 8 0 0 1 8-8h8l4-7h16l4 7h8a8 8 0 0 1 8 8v23a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8Z" fill="#f4ecdf" stroke="#4a3429" stroke-width="4"/>
                <circle cx="36" cy="36" r="12" fill="none" stroke="#9b5336" stroke-width="4"/>
                <circle cx="36" cy="36" r="4" fill="#4a3429"/>
                <circle cx="55" cy="25" r="2.5" fill="#c28a5c"/>
                <path d="M31 30a8 8 0 0 1 8-1" fill="none" stroke="#f4ecdf" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
              <strong>Drop your film scan here</strong>
              or click to choose a JPG, PNG, or TIFF file
            </div>
          </label>
          <canvas id="previewCanvas" hidden></canvas>
        </div>

        <div class="editor">
          <div class="meta">
            <span class="pill" id="imageMeta">Image: -</span>
            <span class="pill" id="boxMeta">Frames: 0</span>
          </div>
          <div class="inspector" id="frameInspector"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      image: null,
      imageName: "",
      boxes: [],
      selected: -1,
      detectedPortrait: false,
      scale: 1,
      previewMax: 2200
    };

    const $ = (id) => document.getElementById(id);
    const previewCanvas = $("previewCanvas");
    const ctx = previewCanvas.getContext("2d");

    function luminance(r, g, b) {
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function imageWidth() {
      return state.image ? (state.image.naturalWidth || state.image.width) : 0;
    }

    function imageHeight() {
      return state.image ? (state.image.naturalHeight || state.image.height) : 0;
    }

    function sortedBoxes() {
      return [...state.boxes].sort((a, b) => a.order - b.order);
    }

    function setMessage(text) {
      $("message").textContent = text;
    }

    function drawPreview() {
      if (!state.image) return;
      const img = state.image;
      const width = imageWidth();
      const height = imageHeight();
      state.scale = Math.min(1, state.previewMax / Math.max(width, height));
      previewCanvas.width = Math.max(1, Math.round(width * state.scale));
      previewCanvas.height = Math.max(1, Math.round(height * state.scale));
      ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      ctx.drawImage(img, 0, 0, previewCanvas.width, previewCanvas.height);

      sortedBoxes().forEach((box, displayIndex) => {
        const originalIndex = state.boxes.indexOf(box);
        const x = box.x * state.scale;
        const y = box.y * state.scale;
        const w = box.width * state.scale;
        const h = box.height * state.scale;
        ctx.lineWidth = Math.max(2, Math.round(Math.min(previewCanvas.width, previewCanvas.height) / 550));
        ctx.strokeStyle = box.enabled ? "#c33b32" : "#818b98";
        ctx.fillStyle = box.enabled ? "#c33b32" : "#818b98";
        if (originalIndex === state.selected) {
          ctx.strokeStyle = "#246bfe";
          ctx.fillStyle = "#246bfe";
        }
        ctx.strokeRect(x, y, w, h);
        const label = String(displayIndex + 1);
        const labelW = 24 + label.length * 8;
        const labelH = 22;
        const labelY = Math.max(0, y - labelH - 2);
        ctx.fillRect(x, labelY, labelW, labelH);
        ctx.fillStyle = "#fff";
        ctx.font = "13px system-ui, sans-serif";
        ctx.fillText(label, x + 7, labelY + 15);
      });
    }

    function updateMeta() {
      if (state.image) {
        $("imageMeta").textContent = `Image: ${imageWidth()} x ${imageHeight()}`;
        $("status").textContent = state.imageName;
      } else {
        $("imageMeta").textContent = "Image: -";
        $("status").textContent = "No image loaded";
      }
      const enabled = state.boxes.filter((box) => box.enabled).length;
      $("boxMeta").textContent = `Frames: ${enabled}`;
      $("exportBtn").disabled = !enabled;
      $("addBtn").disabled = !state.image;
      $("detectBtn").disabled = !state.image;
      $("resetBtn").disabled = !state.image;
    }

    function inspectorNumberInput(box, key, min, max) {
      const input = document.createElement("input");
      input.type = "number";
      input.min = min;
      input.max = max;
      input.step = 1;
      input.value = box[key];
      input.addEventListener("change", () => {
        box[key] = Math.round(clamp(Number(input.value) || min, min, max));
        clampBox(box);
        render();
      });
      return input;
    }

    function cropEditorView(box, canvas) {
      const imageW = imageWidth();
      const imageH = imageHeight();
      const paddingX = Math.max(30, box.width * 0.16);
      const paddingY = Math.max(30, box.height * 0.16);
      let viewX = Math.max(0, box.x - paddingX);
      let viewY = Math.max(0, box.y - paddingY);
      let viewW = Math.min(imageW - viewX, box.width + paddingX * 2);
      let viewH = Math.min(imageH - viewY, box.height + paddingY * 2);
      const canvasRatio = canvas.width / canvas.height;
      const viewRatio = viewW / Math.max(1, viewH);

      if (viewRatio > canvasRatio) {
        const wantedH = viewW / canvasRatio;
        viewY = clamp(viewY - (wantedH - viewH) / 2, 0, Math.max(0, imageH - wantedH));
        viewH = Math.min(imageH, wantedH);
      } else {
        const wantedW = viewH * canvasRatio;
        viewX = clamp(viewX - (wantedW - viewW) / 2, 0, Math.max(0, imageW - wantedW));
        viewW = Math.min(imageW, wantedW);
      }

      return {
        x: viewX,
        y: viewY,
        width: viewW,
        height: viewH,
        scaleX: canvas.width / Math.max(1, viewW),
        scaleY: canvas.height / Math.max(1, viewH)
      };
    }

    function drawCropEditor(canvas, box, view = cropEditorView(box, canvas)) {
      const cropCtx = canvas.getContext("2d");
      cropCtx.clearRect(0, 0, canvas.width, canvas.height);
      cropCtx.drawImage(
        state.image,
        view.x,
        view.y,
        view.width,
        view.height,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const left = (box.x - view.x) * view.scaleX;
      const top = (box.y - view.y) * view.scaleY;
      const right = (box.x + box.width - view.x) * view.scaleX;
      const bottom = (box.y + box.height - view.y) * view.scaleY;

      cropCtx.save();
      cropCtx.fillStyle = "rgba(35, 24, 19, 0.48)";
      cropCtx.beginPath();
      cropCtx.rect(0, 0, canvas.width, canvas.height);
      cropCtx.rect(left, top, right - left, bottom - top);
      cropCtx.fill("evenodd");

      cropCtx.strokeStyle = "#fff";
      cropCtx.lineWidth = 5;
      cropCtx.strokeRect(left, top, right - left, bottom - top);
      cropCtx.strokeStyle = "#9b5336";
      cropCtx.lineWidth = 2.5;
      cropCtx.strokeRect(left, top, right - left, bottom - top);

      const handles = [
        [left, top],
        [(left + right) / 2, top],
        [right, top],
        [right, (top + bottom) / 2],
        [right, bottom],
        [(left + right) / 2, bottom],
        [left, bottom],
        [left, (top + bottom) / 2]
      ];
      handles.forEach(([x, y]) => {
        cropCtx.beginPath();
        cropCtx.arc(x, y, 7, 0, Math.PI * 2);
        cropCtx.fillStyle = "#fff";
        cropCtx.fill();
        cropCtx.strokeStyle = "#9b5336";
        cropCtx.lineWidth = 3;
        cropCtx.stroke();
      });
      cropCtx.restore();
      canvas._cropView = view;
    }

    function cropEditorHit(canvas, box, event) {
      const rect = canvas.getBoundingClientRect();
      const pointX = (event.clientX - rect.left) * canvas.width / rect.width;
      const pointY = (event.clientY - rect.top) * canvas.height / rect.height;
      const view = canvas._cropView;
      const left = (box.x - view.x) * view.scaleX;
      const top = (box.y - view.y) * view.scaleY;
      const right = (box.x + box.width - view.x) * view.scaleX;
      const bottom = (box.y + box.height - view.y) * view.scaleY;
      const threshold = 18;
      const nearLeft = Math.abs(pointX - left) <= threshold;
      const nearRight = Math.abs(pointX - right) <= threshold;
      const nearTop = Math.abs(pointY - top) <= threshold;
      const nearBottom = Math.abs(pointY - bottom) <= threshold;
      const withinX = pointX >= left - threshold && pointX <= right + threshold;
      const withinY = pointY >= top - threshold && pointY <= bottom + threshold;
      let mode = "";
      if (nearTop && nearLeft) mode = "top-left";
      else if (nearTop && nearRight) mode = "top-right";
      else if (nearBottom && nearLeft) mode = "bottom-left";
      else if (nearBottom && nearRight) mode = "bottom-right";
      else if (nearLeft && withinY) mode = "left";
      else if (nearRight && withinY) mode = "right";
      else if (nearTop && withinX) mode = "top";
      else if (nearBottom && withinX) mode = "bottom";
      return { mode, pointX, pointY };
    }

    function attachCropEditor(canvas, box) {
      let drag = null;
      canvas.addEventListener("pointerdown", (event) => {
        const hit = cropEditorHit(canvas, box, event);
        if (!hit.mode) return;
        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        drag = {
          mode: hit.mode,
          startX: hit.pointX,
          startY: hit.pointY,
          box: { x: box.x, y: box.y, width: box.width, height: box.height },
          view: canvas._cropView
        };
      });

      canvas.addEventListener("pointermove", (event) => {
        if (!drag) return;
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const pointX = (event.clientX - rect.left) * canvas.width / rect.width;
        const pointY = (event.clientY - rect.top) * canvas.height / rect.height;
        const dx = (pointX - drag.startX) / drag.view.scaleX;
        const dy = (pointY - drag.startY) / drag.view.scaleY;
        const start = drag.box;
        const minSize = 20;
        const startRight = start.x + start.width;
        const startBottom = start.y + start.height;

        if (drag.mode.includes("left")) {
          box.x = Math.round(clamp(start.x + dx, 0, startRight - minSize));
          box.width = Math.round(startRight - box.x);
        }
        if (drag.mode.includes("right")) {
          box.width = Math.round(clamp(start.width + dx, minSize, imageWidth() - start.x));
        }
        if (drag.mode.includes("top")) {
          box.y = Math.round(clamp(start.y + dy, 0, startBottom - minSize));
          box.height = Math.round(startBottom - box.y);
        }
        if (drag.mode.includes("bottom")) {
          box.height = Math.round(clamp(start.height + dy, minSize, imageHeight() - start.y));
        }

        clampBox(box);
        drawCropEditor(canvas, box, drag.view);
        drawPreview();
        const inputs = $("frameInspector").querySelectorAll(".inspector-field input");
        const values = [box.x, box.y, box.width, box.height];
        inputs.forEach((input, index) => input.value = values[index]);
      });

      const finishDrag = () => {
        if (!drag) return;
        drag = null;
        render();
      };
      canvas.addEventListener("pointerup", finishDrag);
      canvas.addEventListener("pointercancel", finishDrag);
    }

    function renderInspector() {
      const inspector = $("frameInspector");
      inspector.replaceChildren();
      if (!state.image || state.selected < 0 || !state.boxes[state.selected]) {
        const empty = document.createElement("div");
        empty.className = "inspector-empty";
        empty.textContent = state.image
          ? "Click a frame in the preview to view and adjust its crop data."
          : "Upload a film scan, then click a detected frame to edit it.";
        inspector.appendChild(empty);
        return;
      }

      const box = state.boxes[state.selected];
      const head = document.createElement("div");
      head.className = "inspector-head";
      const title = document.createElement("h2");
      title.textContent = `Frame ${box.order}`;
      const enabledLabel = document.createElement("label");
      enabledLabel.className = "enabled-control";
      const enabled = document.createElement("input");
      enabled.type = "checkbox";
      enabled.checked = box.enabled;
      enabled.addEventListener("change", () => {
        box.enabled = enabled.checked;
        render();
      });
      enabledLabel.append(enabled, "Include in export");
      head.append(title, enabledLabel);

      const cropEditor = document.createElement("div");
      cropEditor.className = "crop-editor";
      const cropCanvas = document.createElement("canvas");
      cropCanvas.width = 720;
      cropCanvas.height = 480;
      const cropHelp = document.createElement("div");
      cropHelp.className = "crop-editor-help";
      cropHelp.textContent = "Drag an edge or corner to refine this crop.";
      cropEditor.append(cropCanvas, cropHelp);

      const grid = document.createElement("div");
      grid.className = "inspector-grid";
      [
        ["X position", "x", 0, imageWidth() - 1],
        ["Y position", "y", 0, imageHeight() - 1],
        ["Width", "width", 1, imageWidth()],
        ["Height", "height", 1, imageHeight()]
      ].forEach(([labelText, key, min, max]) => {
        const label = document.createElement("label");
        label.className = "inspector-field";
        label.append(labelText, inspectorNumberInput(box, key, min, max));
        grid.appendChild(label);
      });

      const actions = document.createElement("div");
      actions.className = "inspector-actions";
      const previous = document.createElement("button");
      previous.textContent = "Previous frame";
      previous.disabled = state.selected === 0;
      previous.addEventListener("click", () => {
        state.selected = Math.max(0, state.selected - 1);
        render();
      });
      const next = document.createElement("button");
      next.textContent = "Next frame";
      next.disabled = state.selected === state.boxes.length - 1;
      next.addEventListener("click", () => {
        state.selected = Math.min(state.boxes.length - 1, state.selected + 1);
        render();
      });
      const remove = document.createElement("button");
      remove.className = "delete";
      remove.textContent = "Delete frame";
      remove.addEventListener("click", () => {
        state.boxes.splice(state.selected, 1);
        state.boxes.forEach((item, order) => item.order = order + 1);
        state.selected = state.boxes.length ? Math.min(state.selected, state.boxes.length - 1) : -1;
        render();
      });
      actions.append(previous, next, remove);
      inspector.append(head, cropEditor, grid, actions);
      drawCropEditor(cropCanvas, box);
      attachCropEditor(cropCanvas, box);
    }

    function clampBox(box) {
      const maxW = imageWidth();
      const maxH = imageHeight();
      box.x = Math.round(clamp(box.x, 0, maxW - 1));
      box.y = Math.round(clamp(box.y, 0, maxH - 1));
      box.width = Math.round(clamp(box.width, 1, maxW - box.x));
      box.height = Math.round(clamp(box.height, 1, maxH - box.y));
    }

    function render() {
      $("emptyState").hidden = Boolean(state.image);
      previewCanvas.hidden = !state.image;
      updateMeta();
      renderInspector();
      drawPreview();
    }

    function smoothArray(values, windowSize) {
      const radius = Math.max(0, Math.floor(windowSize / 2));
      if (radius < 1) return values.slice();
      const result = new Float32Array(values.length);
      const prefix = new Float32Array(values.length + 1);
      for (let i = 0; i < values.length; i++) {
        prefix[i + 1] = prefix[i] + values[i];
      }
      for (let i = 0; i < values.length; i++) {
        const start = Math.max(0, i - radius);
        const end = Math.min(values.length - 1, i + radius);
        result[i] = (prefix[end + 1] - prefix[start]) / Math.max(1, end - start + 1);
      }
      return result;
    }

    function closeGaps(mask, maxGap) {
      const result = mask.slice();
      let start = -1;
      for (let i = 0; i < result.length; i++) {
        if (!result[i] && start < 0) {
          start = i;
        } else if (result[i] && start >= 0) {
          if (i - start <= maxGap) {
            for (let j = start; j < i; j++) result[j] = true;
          }
          start = -1;
        }
      }
      return result;
    }

    function activeSegments(mask, minLength) {
      const found = [];
      let start = -1;
      for (let i = 0; i < mask.length; i++) {
        if (mask[i] && start < 0) {
          start = i;
        } else if (!mask[i] && start >= 0) {
          if (i - start >= minLength) found.push([start, i]);
          start = -1;
        }
      }
      if (start >= 0 && mask.length - start >= minLength) found.push([start, mask.length]);
      return found;
    }

    function percentile(values, p) {
      const sorted = Array.from(values).sort((a, b) => a - b);
      if (!sorted.length) return 0;
      const index = clamp(Math.round((sorted.length - 1) * p / 100), 0, sorted.length - 1);
      return sorted[index];
    }

    function analyzeImage(maxSide = 1200) {
      const img = state.image;
      const fullWidth = imageWidth();
      const fullHeight = imageHeight();
      const scale = Math.min(1, maxSide / Math.max(fullWidth, fullHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(fullWidth * scale));
      canvas.height = Math.max(1, Math.round(fullHeight * scale));
      const c = canvas.getContext("2d", { willReadFrequently: true });
      c.drawImage(img, 0, 0, canvas.width, canvas.height);
      const data = c.getImageData(0, 0, canvas.width, canvas.height).data;
      const whiteColumns = new Float32Array(canvas.width);
      const nonWhiteColumns = new Float32Array(canvas.width);
      const nonWhiteRows = new Float32Array(canvas.height);

      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const i = (y * canvas.width + x) * 4;
          const lum = luminance(data[i], data[i + 1], data[i + 2]);
          const isWhite = lum > 242;
          if (isWhite) whiteColumns[x] += 1;
          else {
            nonWhiteColumns[x] += 1;
            nonWhiteRows[y] += 1;
          }
        }
      }

      for (let x = 0; x < canvas.width; x++) {
        whiteColumns[x] /= canvas.height;
        nonWhiteColumns[x] /= canvas.height;
      }
      for (let y = 0; y < canvas.height; y++) {
        nonWhiteRows[y] /= canvas.width;
      }

      return {
        scale,
        width: canvas.width,
        height: canvas.height,
        whiteColumns,
        nonWhiteColumns,
        nonWhiteRows,
        data
      };
    }

    function detectVerticalLanes(analysis, forcedLaneCount) {
      if (forcedLaneCount > 0) {
        const lanes = [];
        for (let i = 0; i < forcedLaneCount; i++) {
          lanes.push([analysis.width * i / forcedLaneCount, analysis.width * (i + 1) / forcedLaneCount]);
        }
        return lanes;
      }

      const whiteProfile = smoothArray(analysis.whiteColumns, Math.max(9, Math.round(analysis.width / 65)));
      const gaps = activeSegments(
        Array.from(whiteProfile, (value, index) => value > 0.72 && index > analysis.width * 0.05 && index < analysis.width * 0.95),
        Math.max(20, Math.round(analysis.width / 18))
      );
      const lanes = [];
      let cursor = 0;
      gaps.forEach(([start, end]) => {
        if (start - cursor >= analysis.width * 0.16) lanes.push([cursor, start]);
        cursor = end;
      });
      if (analysis.width - cursor >= analysis.width * 0.16) lanes.push([cursor, analysis.width]);
      if (lanes.length >= 1 && lanes.length <= 4) return lanes;

      const nonWhiteProfile = smoothArray(analysis.nonWhiteColumns, Math.max(9, Math.round(analysis.width / 80)));
      const threshold = Math.max(0.05, percentile(nonWhiteProfile, 20));
      const mask = closeGaps(Array.from(nonWhiteProfile, (value) => value > threshold), Math.max(3, Math.round(analysis.width / 25)));
      const fallback = activeSegments(mask, Math.max(20, Math.round(analysis.width / 8)));
      return fallback.length ? fallback : [[0, analysis.width]];
    }

    function detectHorizontalLanes(analysis, forcedLaneCount) {
      if (forcedLaneCount > 0) {
        const lanes = [];
        for (let i = 0; i < forcedLaneCount; i++) {
          lanes.push([analysis.height * i / forcedLaneCount, analysis.height * (i + 1) / forcedLaneCount]);
        }
        return lanes;
      }
      return [[0, analysis.height]];
    }

    function detectedFrameCount(span, frameAxis, fullAxis, laneCount) {
      if (laneCount > 1) {
        return clamp(Math.round(fullAxis / Math.max(frameAxis * 1.08, 1)), 1, 40);
      }
      return clamp(Math.round(span / Math.max(frameAxis * 1.08, 1)), 1, 40);
    }

    function smartFrameCount(axisLength, laneWidth, laneCount, forcedFrames, portrait = false) {
      if (forcedFrames > 0) return clamp(forcedFrames, 1, 80);
      const nominalHeight = Math.max(1, portrait ? laneWidth * 1.5 : laneWidth / 1.5);
      const spacingFactor = laneCount > 1 ? 1.08 : 1.30;
      return clamp(Math.round(axisLength / (nominalHeight * spacingFactor)), 1, 40);
    }

    function independentLaneFrameCount(axisLength, laneWidth, laneCount, forcedFrames, portrait, bands) {
      const fallback = smartFrameCount(axisLength, laneWidth, laneCount, forcedFrames, portrait);
      if (forcedFrames > 0 || bands.length < 2) return fallback;

      const nominalHeight = Math.max(1, portrait ? laneWidth * 1.5 : laneWidth / 1.5);
      const gaps = [];
      for (let index = 1; index < bands.length; index++) {
        const gap = bands[index].center - bands[index - 1].center;
        if (gap >= nominalHeight * 0.55 && gap <= nominalHeight * 1.8) gaps.push(gap);
      }
      if (!gaps.length) return fallback;

      gaps.sort((a, b) => a - b);
      const pitch = gaps[Math.floor(gaps.length / 2)];
      const laneEstimate = clamp(Math.round(axisLength / pitch), 1, 40);
      return Math.abs(laneEstimate - fallback) <= 3 ? laneEstimate : fallback;
    }

    function inferVerticalFramePortrait(analysis, lanes, boundarySensitivity) {
      // A rotated half-frame advances roughly 2/3 of the strip width per
      // exposure; a rotated full 35 mm frame advances roughly 3/2.  Use the
      // repeated separator pitch instead of scene content so very dark, blank,
      // or overexposed photos do not change the selected format.
      const normalizedGaps = [];
      lanes.forEach(([laneStart, laneEnd]) => {
        const laneWidth = Math.max(1, laneEnd - laneStart);
        const bands = darkSeparatorBandsForLane(analysis, laneStart, laneEnd, boundarySensitivity);
        for (let index = 1; index < bands.length; index++) {
          const normalized = (bands[index].center - bands[index - 1].center) / laneWidth;
          if (normalized >= 0.42 && normalized <= 1.90) normalizedGaps.push(normalized);
        }
      });

      if (normalizedGaps.length >= 2) {
        normalizedGaps.sort((a, b) => a - b);
        // Missed separators create integer-multiple gaps.  Looking at the
        // lower half preserves the fundamental pitch when a dark frame hides
        // one boundary.
        const fundamental = normalizedGaps[
          Math.floor(Math.max(0, normalizedGaps.length - 1) * 0.35)
        ];
        return fundamental > 1.24;
      }

      // Preserve the established half-frame behavior when the scan has too
      // few trustworthy separator bands to identify the format automatically.
      return false;
    }

    function darkSeparatorProfile(analysis, x1, x2) {
      const startX = Math.max(0, Math.floor(x1));
      const endX = Math.min(analysis.width, Math.ceil(x2));
      const profile = new Float32Array(analysis.height);
      for (let y = 0; y < analysis.height; y++) {
        let dark = 0;
        let sum = 0;
        let sumSquares = 0;
        for (let x = startX; x < endX; x++) {
          const i = (y * analysis.width + x) * 4;
          const lum = luminance(analysis.data[i], analysis.data[i + 1], analysis.data[i + 2]);
          if (lum < 58) dark += 1;
          sum += lum;
          sumSquares += lum * lum;
        }
        const width = Math.max(1, endX - startX);
        const darkRatio = dark / width;
        const mean = sum / width;
        const variance = Math.max(0, sumSquares / width - mean * mean);
        const std = Math.sqrt(variance);
        let darkScore = darkRatio;
        if (mean > 72) darkScore *= 0.45;
        if (std > 38) {
          darkScore *= 0.40;
        }
        profile[y] = darkScore;
      }
      return profile;
    }

    function darkSeparatorBandsForLane(analysis, laneStart, laneEnd, boundarySensitivity) {
      const laneWidth = laneEnd - laneStart;
      const inset = Math.max(2, laneWidth * 0.04);
      const rawProfile = darkSeparatorProfile(analysis, laneStart + inset, laneEnd - inset);
      const profile = smoothArray(
        rawProfile,
        Math.max(3, Math.round(laneWidth * 0.018))
      );
      const threshold = clamp(boundarySensitivity || 82, 70, 95) / 100;
      const mask = Array.from(profile, (value) => value > threshold);
      const expanded = activeSegments(mask, Math.max(2, Math.round(laneWidth * 0.018)))
        .map(([roughStart, roughEnd]) => {
          const rawThreshold = threshold * 0.78;
          let start = roughStart;
          let end = roughEnd;
          while (start > 0 && rawProfile[start - 1] > rawThreshold) start -= 1;
          while (end < rawProfile.length && rawProfile[end] > rawThreshold) end += 1;
          return { start, end, roughStart, roughEnd };
        })
        .filter((band) => band.end - band.start <= Math.max(12, laneWidth * 0.42));

      const plausibleWidths = expanded
        .map((band) => band.end - band.start)
        .filter((width) => width >= laneWidth * 0.018 && width <= laneWidth * 0.18)
        .sort((a, b) => a - b);
      const lowerHalf = plausibleWidths.slice(0, Math.max(1, Math.ceil(plausibleWidths.length / 2)));
      const typicalWidth = lowerHalf.length
        ? lowerHalf[Math.floor(lowerHalf.length / 2)]
        : Math.max(3, laneWidth * 0.075);
      const maximumNormalWidth = Math.max(typicalWidth * 1.45, laneWidth * 0.11);

      return expanded.flatMap((band) => {
        const { start, end } = band;
        if (end - start > maximumNormalWidth) {
          const startBand = {
            start,
            end: Math.min(end, start + typicalWidth),
            center: start + typicalWidth / 2,
            derived: true
          };
          const endBand = {
            start: Math.max(start, end - typicalWidth),
            end,
            center: end - typicalWidth / 2,
            derived: true
          };
          return [startBand, endBand];
        }
        return [{ start, end, center: (start + end) / 2, derived: false }];
      });
    }

    function filmOpeningColumnsForLane(analysis, laneStart, laneEnd) {
      const start = Math.max(0, Math.floor(laneStart));
      const end = Math.min(analysis.width, Math.ceil(laneEnd));
      const laneWidth = Math.max(1, end - start);
      const profile = smoothArray(
        Array.from(analysis.nonWhiteColumns.slice(start, end)),
        Math.max(3, Math.round(laneWidth * 0.018))
      );
      const active = activeSegments(
        Array.from(profile, (value) => value > 0.56),
        Math.max(8, Math.round(laneWidth * 0.36))
      );
      const opening = active.length
        ? active.reduce((best, item) => item[1] - item[0] > best[1] - best[0] ? item : best)
        : [0, laneWidth];
      const safety = Math.max(0.5, laneWidth * 0.003);
      return {
        left: start + opening[0] + safety,
        right: start + opening[1] - safety
      };
    }

    function halfFramePhotoColumnsForLane(analysis, laneStart, laneEnd) {
      const outer = filmOpeningColumnsForLane(analysis, laneStart, laneEnd);
      const start = Math.max(0, Math.floor(laneStart));
      const end = Math.min(analysis.width, Math.ceil(laneEnd));
      const laneWidth = Math.max(1, end - start);
      const rawProfile = new Float32Array(laneWidth);

      for (let localX = 0; localX < laneWidth; localX++) {
        const x = start + localX;
        let dark = 0;
        let sum = 0;
        let sumSquares = 0;
        for (let y = 0; y < analysis.height; y++) {
          const i = (y * analysis.width + x) * 4;
          const lum = luminance(analysis.data[i], analysis.data[i + 1], analysis.data[i + 2]);
          if (lum < 58) dark += 1;
          sum += lum;
          sumSquares += lum * lum;
        }
        const samples = Math.max(1, analysis.height);
        const mean = sum / samples;
        const variance = Math.max(0, sumSquares / samples - mean * mean);
        const std = Math.sqrt(variance);
        let score = dark / samples;
        if (mean > 72) score *= 0.45;
        if (std > 38) score *= 0.45;
        rawProfile[localX] = score;
      }

      const profile = smoothArray(rawProfile, Math.max(1, Math.round(laneWidth * 0.008)));
      const threshold = Math.max(0.48, percentile(profile, 82) * 0.76);
      const segments = activeSegments(
        Array.from(profile, (value) => value > threshold),
        Math.max(1, Math.round(laneWidth * 0.004))
      ).filter(([segmentStart, segmentEnd]) =>
        segmentEnd - segmentStart <= Math.max(4, laneWidth * 0.16)
      );

      const outerLeft = outer.left - start;
      const outerRight = outer.right - start;
      const edgeReach = laneWidth * 0.055;
      const leftBorder = segments.find(([segmentStart]) =>
        segmentStart <= outerLeft + edgeReach
      );
      const rightBorder = [...segments].reverse().find(([, segmentEnd]) =>
        segmentEnd >= outerRight - edgeReach
      );

      const left = leftBorder
        ? start + leftBorder[1]
        : outer.left;
      const right = rightBorder
        ? start + rightBorder[0]
        : outer.right;
      if (right - left < laneWidth * 0.68) return outer;
      return { left, right };
    }

    function fullFrameOuterPhotoEdges(analysis, openingColumns, pitchPreview) {
      const startX = Math.max(0, Math.floor(openingColumns.left));
      const endX = Math.min(analysis.width, Math.ceil(openingColumns.right));
      const profile = new Float32Array(analysis.height);
      for (let y = 0; y < analysis.height; y++) {
        let nonWhite = 0;
        for (let x = startX; x < endX; x++) {
          const i = (y * analysis.width + x) * 4;
          if (luminance(analysis.data[i], analysis.data[i + 1], analysis.data[i + 2]) < 242) {
            nonWhite += 1;
          }
        }
        profile[y] = nonWhite / Math.max(1, endX - startX);
      }

      const smoothed = smoothArray(profile, Math.max(3, Math.round((endX - startX) * 0.012)));
      const sustain = Math.max(2, Math.round((endX - startX) * 0.018));
      const searchLength = Math.min(analysis.height, Math.round(pitchPreview * 0.32));
      let top = 0;
      if (smoothed[0] < 0.20) {
        for (let y = 0; y <= searchLength - sustain; y++) {
          let active = 0;
          for (let offset = 0; offset < sustain; offset++) {
            if (smoothed[y + offset] > 0.34) active += 1;
          }
          if (active >= Math.ceil(sustain * 0.75)) {
            top = y;
            break;
          }
        }
      }

      let bottom = analysis.height;
      if (smoothed[analysis.height - 1] < 0.20) {
        for (let y = analysis.height - 1; y >= analysis.height - searchLength + sustain; y--) {
          let active = 0;
          for (let offset = 0; offset < sustain; offset++) {
            if (smoothed[y - offset] > 0.34) active += 1;
          }
          if (active >= Math.ceil(sustain * 0.75)) {
            bottom = y + 1;
            break;
          }
        }
      }
      return { top, bottom };
    }

    function orderedFullFrameBands(localBands, fallbackBands, frames, pitchPreview) {
      const isInternal = (band) =>
        band.center > pitchPreview * 0.25 &&
        band.center < pitchPreview * (frames - 0.25);
      const localInternal = localBands.filter(isInternal).sort((a, b) => a.center - b.center);
      if (
        localInternal.length === frames - 1 &&
        localInternal.every((band) => !band.derived)
      ) return localInternal;

      const offsets = [];
      localInternal.forEach((local) => {
        let nearest = null;
        let nearestDistance = Infinity;
        fallbackBands.forEach((fallback) => {
          const distance = Math.abs(local.center - fallback.center);
          if (distance < nearestDistance && distance <= pitchPreview * 0.28) {
            nearest = fallback;
            nearestDistance = distance;
          }
        });
        if (nearest) offsets.push(local.center - nearest.center);
      });
      offsets.sort((a, b) => a - b);
      const fallbackOffset = offsets.length ? offsets[Math.floor(offsets.length / 2)] : 0;
      const alignedFallbackBands = fallbackBands.map((band) => ({
        start: band.start + fallbackOffset,
        end: band.end + fallbackOffset,
        center: band.center + fallbackOffset
      }));
      const tagged = [
        ...localInternal.map((band) => ({ ...band, local: !band.derived })),
        ...alignedFallbackBands.map((band) => ({ ...band, local: false }))
      ]
        .filter(isInternal)
        .sort((a, b) => a.center - b.center);
      const clusters = [];
      const clusterDistance = Math.max(2, pitchPreview * 0.07);
      tagged.forEach((band) => {
        const last = clusters[clusters.length - 1];
        if (!last || band.center - last[last.length - 1].center > clusterDistance) {
          clusters.push([band]);
        } else {
          last.push(band);
        }
      });
      const candidates = clusters.map((cluster) => {
        const local = cluster.find((band) => band.local);
        if (local) return local;
        const fallback = cluster.find((band) => !band.derived);
        if (fallback) return fallback;
        const derived = cluster.find((band) => band.derived);
        if (derived) return { ...derived, local: false };
        const start = cluster.reduce((sum, band) => sum + band.start, 0) / cluster.length;
        const end = cluster.reduce((sum, band) => sum + band.end, 0) / cluster.length;
        return { start, end, center: (start + end) / 2, local: false };
      });

      if (candidates.length === frames - 1) return candidates;

      const selected = [];
      let previousIndex = -1;
      for (let boundaryIndex = 1; boundaryIndex < frames; boundaryIndex++) {
        const target = boundaryIndex * pitchPreview;
        let bestIndex = -1;
        let bestDistance = Infinity;
        const eligibleIndexes = [];
        for (let index = previousIndex + 1; index < candidates.length; index++) {
          const distance = Math.abs(candidates[index].center - target);
          if (distance <= pitchPreview * 0.22) eligibleIndexes.push(index);
        }
        const localIndexes = eligibleIndexes.filter((index) => candidates[index].local);
        const pool = localIndexes.length ? localIndexes : eligibleIndexes;
        for (const index of pool) {
          const distance = Math.abs(candidates[index].center - target);
          if (distance < bestDistance) {
            bestIndex = index;
            bestDistance = distance;
          }
        }
        if (bestIndex >= 0) {
          selected.push(candidates[bestIndex]);
          previousIndex = bestIndex;
        } else {
          selected.push(null);
        }
      }
      return selected;
    }

    // Kept byte-for-byte in behavior for the established half-frame path.
    function rowBlankProfile(analysis, x1, x2) {
      const startX = Math.max(0, Math.floor(x1));
      const endX = Math.min(analysis.width, Math.ceil(x2));
      const profile = new Float32Array(analysis.height);
      for (let y = 0; y < analysis.height; y++) {
        let dark = 0;
        let light = 0;
        let sum = 0;
        let sumSquares = 0;
        for (let x = startX; x < endX; x++) {
          const i = (y * analysis.width + x) * 4;
          const lum = luminance(analysis.data[i], analysis.data[i + 1], analysis.data[i + 2]);
          if (lum < 58) dark += 1;
          if (lum > 232) light += 1;
          sum += lum;
          sumSquares += lum * lum;
        }
        const width = Math.max(1, endX - startX);
        const darkRatio = dark / width;
        const lightRatio = light / width;
        const mean = sum / width;
        const variance = Math.max(0, sumSquares / width - mean * mean);
        const std = Math.sqrt(variance);
        let darkScore = darkRatio;
        let lightScore = lightRatio;
        if (mean > 72) darkScore *= 0.45;
        if (mean < 218) lightScore *= 0.45;
        if (std > 38) {
          darkScore *= 0.40;
          lightScore *= 0.40;
        }
        profile[y] = Math.max(darkScore, lightScore);
      }
      return profile;
    }

    function legacySeparatorBandsForLane(analysis, laneStart, laneEnd, boundarySensitivity) {
      const laneWidth = laneEnd - laneStart;
      const inset = Math.max(2, laneWidth * 0.04);
      const profile = smoothArray(
        rowBlankProfile(analysis, laneStart + inset, laneEnd - inset),
        Math.max(3, Math.round(laneWidth * 0.018))
      );
      const threshold = clamp(boundarySensitivity || 82, 70, 95) / 100;
      const mask = Array.from(profile, (value) => value > threshold);
      return activeSegments(mask, Math.max(2, Math.round(laneWidth * 0.018)))
        .filter(([start, end]) => end - start <= Math.max(8, laneWidth * 0.28))
        .map(([start, end]) => ({ start, end, center: (start + end) / 2 }));
    }

    function rowDetailProfile(analysis, x1, x2) {
      const startX = Math.max(0, Math.floor(x1));
      const endX = Math.min(analysis.width, Math.ceil(x2));
      const profile = new Float32Array(analysis.height);
      for (let y = 0; y < analysis.height; y++) {
        let sum = 0;
        let sumSquares = 0;
        for (let x = startX; x < endX; x++) {
          const i = (y * analysis.width + x) * 4;
          const lum = luminance(analysis.data[i], analysis.data[i + 1], analysis.data[i + 2]);
          sum += lum;
          sumSquares += lum * lum;
        }
        const width = Math.max(1, endX - startX);
        const mean = sum / width;
        const variance = Math.max(0, sumSquares / width - mean * mean);
        const std = Math.sqrt(variance);
        profile[y] = clamp((std - 8) / 42, 0, 1);
      }
      return profile;
    }

    function refineTopBoundary(analysis, laneStart, laneEnd, boundary, slotStart, slotEnd, pitchPreview, topInset) {
      const laneWidth = laneEnd - laneStart;
      const inset = Math.max(2, laneWidth * 0.06);
      const detail = smoothArray(
        rowDetailProfile(analysis, laneStart + inset, laneEnd - inset),
        Math.max(3, Math.round(laneWidth * 0.012))
      );
      const blank = smoothArray(
        rowBlankProfile(analysis, laneStart + inset, laneEnd - inset),
        Math.max(3, Math.round(laneWidth * 0.012))
      );
      const searchStart = Math.max(slotStart, boundary.start - pitchPreview * 0.04);
      const searchEnd = Math.min(slotEnd, boundary.end + pitchPreview * 0.18);
      const sustain = Math.max(2, Math.round(laneWidth * 0.018));

      for (let y = Math.floor(searchStart); y <= Math.floor(searchEnd - sustain); y++) {
        let votes = 0;
        for (let offset = 0; offset < sustain; offset++) {
          const index = y + offset;
          if (detail[index] > 0.18 || blank[index] < 0.58) votes += 1;
        }
        if (votes >= Math.ceil(sustain * 0.7)) {
          const detectedTop = Math.max(slotStart + topInset, y + topInset);
          const safeTopLimit = boundary.end + topInset + pitchPreview * 0.02;
          return Math.min(detectedTop, safeTopLimit);
        }
      }

      return Math.max(slotStart + topInset, boundary.end + topInset);
    }

    function refineLeftBoundary(analysis, laneStart, laneEnd, top, bottom, fallbackInset) {
      const laneWidth = laneEnd - laneStart;
      const fallback = laneStart + fallbackInset;
      const searchStart = Math.max(laneStart, fallback - laneWidth * 0.045);
      const searchEnd = Math.min(laneEnd, fallback + laneWidth * 0.045);
      const startY = Math.max(0, Math.floor(top + (bottom - top) * 0.07));
      const endY = Math.min(analysis.height, Math.ceil(bottom - (bottom - top) * 0.07));
      const scores = [];

      for (let x = Math.floor(searchStart); x < Math.ceil(searchEnd); x++) {
        let sum = 0;
        let sumSquares = 0;
        for (let y = startY; y < endY; y++) {
          const index = (y * analysis.width + x) * 4;
          const lum = luminance(analysis.data[index], analysis.data[index + 1], analysis.data[index + 2]);
          sum += lum;
          sumSquares += lum * lum;
        }
        const sampleCount = Math.max(1, endY - startY);
        const mean = sum / sampleCount;
        const variance = Math.max(0, sumSquares / sampleCount - mean * mean);
        const detailScore = clamp((Math.sqrt(variance) - 7) / 38, 0, 1);
        const toneScore = mean > 42 && mean < 238 ? clamp((mean - 42) / 105, 0, 1) * 0.28 : 0;
        scores.push(detailScore + toneScore);
      }

      if (scores.length < 3) return fallback;
      const smoothed = smoothArray(scores, Math.max(3, Math.round(laneWidth * 0.01)));
      const threshold = Math.max(0.22, percentile(smoothed, 68) * 0.58);
      const sustain = Math.max(2, Math.round(laneWidth * 0.012));
      for (let index = 0; index <= smoothed.length - sustain; index++) {
        let active = 0;
        for (let offset = 0; offset < sustain; offset++) {
          if (smoothed[index + offset] >= threshold) active += 1;
        }
        if (active >= Math.ceil(sustain * 0.75)) {
          return clamp(Math.floor(searchStart) + index, searchStart, searchEnd);
        }
      }
      return fallback;
    }

    function smartHalfFrameBoxes(analysis, laneStart, laneEnd, laneCount, forcedFrames, rowGapPercent, boundarySensitivity) {
      const laneWidth = laneEnd - laneStart;
      const leftInset = Math.max(3, laneWidth * (laneCount > 1 ? 0.055 : 0.047));
      const rightInset = Math.max(2, laneWidth * (laneCount > 1 ? 0.032 : 0.024));
      const cropWidthPreview = Math.max(8, laneWidth - leftInset - rightInset);
      const bands = legacySeparatorBandsForLane(analysis, laneStart, laneEnd, boundarySensitivity);
      const frames = independentLaneFrameCount(analysis.height, laneWidth, laneCount, forcedFrames, false, bands);
      const pitchPreview = analysis.height / frames;
      const aspectHeight = cropWidthPreview / 1.5;
      const gapFactor = clamp(rowGapPercent || 8, 2, 20) / 100;
      const topInset = Math.max(0.5, pitchPreview * gapFactor * 0.035);
      const bottomInset = Math.max(1, pitchPreview * gapFactor * 0.14);
      const maxHeightPreview = Math.min(pitchPreview * (1 - gapFactor * 0.25), aspectHeight * 1.35);
      const minHeightPreview = Math.min(maxHeightPreview, aspectHeight * 0.72);
      const rightEdge = laneEnd - rightInset;
      const boundaries = [];

      for (let boundaryIndex = 0; boundaryIndex <= frames; boundaryIndex++) {
        if (boundaryIndex === 0) {
          const firstBand = bands.find((band) => band.start <= pitchPreview * 0.20);
          boundaries.push(firstBand || { start: 0, end: 0 });
          continue;
        }
        if (boundaryIndex === frames) {
          const lastBand = [...bands].reverse().find((band) => band.end >= analysis.height - pitchPreview * 0.20);
          boundaries.push(lastBand || { start: analysis.height, end: analysis.height });
          continue;
        }

        const target = boundaryIndex * pitchPreview;
        let best = null;
        let bestDistance = Infinity;
        bands.forEach((band) => {
          const distance = Math.abs(band.center - target);
          if (distance < bestDistance && distance <= pitchPreview * 0.34) {
            best = band;
            bestDistance = distance;
          }
        });

        if (best) {
          boundaries.push(best);
        } else {
          const syntheticHalfGap = Math.max(1, pitchPreview * gapFactor * 0.22);
          boundaries.push({
            start: target - syntheticHalfGap,
            end: target + syntheticHalfGap
          });
        }
      }

      const boxes = [];
      for (let frame = 0; frame < frames; frame++) {
        const slotStart = frame * pitchPreview;
        const slotEnd = (frame + 1) * pitchPreview;
        let top = refineTopBoundary(analysis, laneStart, laneEnd, boundaries[frame], slotStart, slotEnd, pitchPreview, topInset);
        let bottom = boundaries[frame + 1].start - bottomInset;
        const intervalCenter = (top + bottom) / 2;
        let height = bottom - top;

        if (height < minHeightPreview || height > maxHeightPreview) {
          height = maxHeightPreview;
          top = intervalCenter - height / 2;
          bottom = intervalCenter + height / 2;
        }

        top = Math.max(slotStart + topInset, top);
        bottom = Math.min(slotEnd - bottomInset, bottom);
        if (bottom - top < minHeightPreview) {
          const center = (slotStart + slotEnd) / 2;
          top = center - maxHeightPreview / 2;
          bottom = center + maxHeightPreview / 2;
        }

        const refinedLeft = refineLeftBoundary(analysis, laneStart, laneEnd, top, bottom, leftInset);
        boxes.push({
          x: refinedLeft / analysis.scale,
          y: top / analysis.scale,
          width: Math.max(8, rightEdge - refinedLeft) / analysis.scale,
          height: (bottom - top) / analysis.scale
        });
      }
      return boxes;
    }

    function physicalHalfFrameBoxes(analysis, laneStart, laneEnd, laneCount, coarseBoxes, rowGapPercent, boundarySensitivity, fallbackBands = []) {
      const frames = coarseBoxes.length;
      if (!frames) return [];
      const laneWidth = laneEnd - laneStart;
      const openingColumns = halfFramePhotoColumnsForLane(analysis, laneStart, laneEnd);
      const cropWidthPreview = Math.max(8, openingColumns.right - openingColumns.left);
      const bands = darkSeparatorBandsForLane(analysis, laneStart, laneEnd, boundarySensitivity);
      const pitchPreview = analysis.height / Math.max(1, frames);
      const internalBands = orderedFullFrameBands(bands, fallbackBands, frames, pitchPreview);
      const reliableBands = internalBands.map((band, index) => {
        const target = (index + 1) * pitchPreview;
        return band &&
          !band.derived &&
          Math.abs(band.center - target) <= pitchPreview * 0.18
          ? band
          : null;
      });
      const reliableCount = reliableBands.filter(Boolean).length;
      const hasReliableLaneGeometry = reliableCount >= Math.max(2, Math.ceil((frames - 1) * 0.60));
      if (!hasReliableLaneGeometry) return coarseBoxes;

      const boxes = [];
      for (let frame = 0; frame < frames; frame++) {
        const coarse = coarseBoxes[frame];
        const coarseTop = coarse.y * analysis.scale;
        const coarseBottom = (coarse.y + coarse.height) * analysis.scale;
        const topBand = frame > 0 ? reliableBands[frame - 1] : null;
        const bottomBand = frame < frames - 1 ? reliableBands[frame] : null;
        const top = topBand ? topBand.end : coarseTop;
        const bottom = bottomBand ? bottomBand.start : coarseBottom;
        boxes.push({
          x: openingColumns.left / analysis.scale,
          y: top / analysis.scale,
          width: cropWidthPreview / analysis.scale,
          height: (bottom - top) / analysis.scale
        });
      }
      return boxes;
    }

    function smartFullFrameBoxes(analysis, laneStart, laneEnd, laneCount, forcedFrames, rowGapPercent, boundarySensitivity, fallbackBands = []) {
      const laneWidth = laneEnd - laneStart;
      const openingColumns = filmOpeningColumnsForLane(analysis, laneStart, laneEnd);
      const cropWidthPreview = Math.max(8, openingColumns.right - openingColumns.left);
      const bands = darkSeparatorBandsForLane(analysis, laneStart, laneEnd, boundarySensitivity);
      const frames = independentLaneFrameCount(analysis.height, laneWidth, laneCount, forcedFrames, true, bands);
      const pitchPreview = analysis.height / frames;
      const gapFactor = clamp(rowGapPercent || 8, 2, 20) / 100;
      const edgeInset = Math.max(0.5, pitchPreview * gapFactor * 0.018);
      const outerEdges = fullFrameOuterPhotoEdges(analysis, openingColumns, pitchPreview);
      const internalBands = orderedFullFrameBands(bands, fallbackBands, frames, pitchPreview);
      const boundaries = [];

      for (let boundaryIndex = 0; boundaryIndex <= frames; boundaryIndex++) {
        if (boundaryIndex === 0) {
          boundaries.push({ start: outerEdges.top, end: outerEdges.top });
          continue;
        }
        if (boundaryIndex === frames) {
          boundaries.push({ start: outerEdges.bottom, end: outerEdges.bottom });
          continue;
        }

        const target = boundaryIndex * pitchPreview;
        const best = internalBands[boundaryIndex - 1];

        if (best) {
          boundaries.push(best);
        } else {
          const syntheticHalfGap = Math.max(1, pitchPreview * gapFactor * 0.22);
          boundaries.push({
            start: target - syntheticHalfGap,
            end: target + syntheticHalfGap
          });
        }
      }

      const boxes = [];
      for (let frame = 0; frame < frames; frame++) {
        const slotStart = frame * pitchPreview;
        const slotEnd = (frame + 1) * pitchPreview;
        let top = boundaries[frame].end + edgeInset;
        let bottom = boundaries[frame + 1].start - edgeInset;

        // Only synthesize an interval when separator detection is genuinely
        // invalid. Never move a valid physical edge merely to force 3:2.
        if (bottom - top < pitchPreview * 0.40) {
          const syntheticGap = Math.max(1, pitchPreview * gapFactor * 0.11);
          top = slotStart + syntheticGap;
          bottom = slotEnd - syntheticGap;
        }

        boxes.push({
          x: openingColumns.left / analysis.scale,
          y: top / analysis.scale,
          width: cropWidthPreview / analysis.scale,
          height: (bottom - top) / analysis.scale
        });
      }
      return boxes;
    }

    function rowPhotoProfile(analysis, x1, x2) {
      const startX = Math.max(0, Math.floor(x1));
      const endX = Math.min(analysis.width, Math.ceil(x2));
      const profile = new Float32Array(analysis.height);
      for (let y = 0; y < analysis.height; y++) {
        let active = 0;
        for (let x = startX; x < endX; x++) {
          const i = (y * analysis.width + x) * 4;
          if (luminance(analysis.data[i], analysis.data[i + 1], analysis.data[i + 2]) > 36) active += 1;
        }
        profile[y] = active / Math.max(1, endX - startX);
      }
      return profile;
    }

    function columnPhotoProfile(analysis, x1, x2, y1, y2) {
      const startX = Math.max(0, Math.floor(x1));
      const endX = Math.min(analysis.width, Math.ceil(x2));
      const startY = Math.max(0, Math.floor(y1));
      const endY = Math.min(analysis.height, Math.ceil(y2));
      const profile = new Float32Array(Math.max(1, endX - startX));
      for (let x = startX; x < endX; x++) {
        let active = 0;
        for (let y = startY; y < endY; y++) {
          const i = (y * analysis.width + x) * 4;
          if (luminance(analysis.data[i], analysis.data[i + 1], analysis.data[i + 2]) > 36) active += 1;
        }
        profile[x - startX] = active / Math.max(1, endY - startY);
      }
      return { profile, offset: startX };
    }

    function spanFromProfile(profile, threshold, minLength) {
      const mask = closeGaps(Array.from(profile, (value) => value > threshold), Math.max(2, Math.round(minLength * 0.12)));
      const spans = activeSegments(mask, minLength);
      if (!spans.length) return null;
      return [Math.min(...spans.map(([start]) => start)), Math.max(...spans.map(([, end]) => end))];
    }

    function refineVerticalFrame(analysis, laneStart, laneEnd, segmentStart, segmentEnd) {
      const laneWidth = laneEnd - laneStart;
      const inset = Math.max(2, laneWidth * 0.025);
      const baseX1 = laneStart + inset;
      const baseX2 = laneEnd - inset;
      const rowProfile = smoothArray(rowPhotoProfile(analysis, baseX1, baseX2), Math.max(3, Math.round(laneWidth * 0.015)));
      const localRows = rowProfile.slice(Math.max(0, Math.floor(segmentStart)), Math.min(analysis.height, Math.ceil(segmentEnd)));
      const rowThreshold = Math.max(0.08, Math.min(0.35, percentile(localRows, 18) * 0.7));
      const localY = spanFromProfile(localRows, rowThreshold, Math.max(3, Math.round(laneWidth * 0.08)));
      let y1 = segmentStart;
      let y2 = segmentEnd;
      if (localY) {
        y1 = Math.max(segmentStart, segmentStart + localY[0]);
        y2 = Math.min(segmentEnd, segmentStart + localY[1]);
      }

      const columns = columnPhotoProfile(analysis, baseX1, baseX2, y1, y2);
      const smoothedColumns = smoothArray(columns.profile, Math.max(3, Math.round(laneWidth * 0.018)));
      const colThreshold = Math.max(0.08, Math.min(0.5, percentile(smoothedColumns, 20) * 0.75));
      const localX = spanFromProfile(smoothedColumns, colThreshold, Math.max(4, Math.round(laneWidth * 0.35)));
      let x1 = baseX1;
      let x2 = baseX2;
      if (localX && localX[1] - localX[0] >= laneWidth * 0.45) {
        x1 = columns.offset + localX[0];
        x2 = columns.offset + localX[1];
      }

      const pad = Math.max(1, laneWidth * 0.006);
      return {
        x: (x1 - pad) / analysis.scale,
        y: (y1 - pad) / analysis.scale,
        width: (x2 - x1 + pad * 2) / analysis.scale,
        height: (y2 - y1 + pad * 2) / analysis.scale
      };
    }

    function verticalPhotoSegments(analysis, laneStart, laneEnd, forcedFrames) {
      const laneWidth = laneEnd - laneStart;
      const inset = Math.max(2, laneWidth * 0.025);
      const profile = smoothArray(
        rowPhotoProfile(analysis, laneStart + inset, laneEnd - inset),
        Math.max(5, Math.round(laneWidth * 0.035))
      );
      const threshold = Math.max(0.10, Math.min(0.48, percentile(profile, 34) * 0.72));
      const mask = closeGaps(Array.from(profile, (value) => value > threshold), Math.max(4, Math.round(laneWidth * 0.08)));
      let segments = activeSegments(mask, Math.max(12, Math.round(laneWidth * 0.28)))
        .filter(([start, end]) => end - start >= laneWidth * 0.34);

      if (forcedFrames > 0 && segments.length !== forcedFrames) {
        const activeSpan = segments.length
          ? [Math.min(...segments.map(([start]) => start)), Math.max(...segments.map(([, end]) => end))]
          : [0, analysis.height];
        const pitch = (activeSpan[1] - activeSpan[0]) / forcedFrames;
        segments = [];
        for (let i = 0; i < forcedFrames; i++) {
          segments.push([activeSpan[0] + i * pitch, activeSpan[0] + (i + 1) * pitch]);
        }
      }

      if (!segments.length) {
        const estimated = detectedFrameCount(analysis.height, laneWidth * 2 / 3, analysis.height, 1);
        const pitch = analysis.height / estimated;
        for (let i = 0; i < estimated; i++) segments.push([i * pitch, (i + 1) * pitch]);
      }

      return segments;
    }

    function rowSpanForVerticalLane(analysis, laneStart, laneEnd, frameHeight, laneCount) {
      if (laneCount > 1) return [0, analysis.height];
      const startX = Math.max(0, Math.floor(laneStart));
      const endX = Math.min(analysis.width, Math.ceil(laneEnd));
      const profile = new Float32Array(analysis.height);
      for (let y = 0; y < analysis.height; y++) {
        let active = 0;
        for (let x = startX; x < endX; x++) {
          const i = (y * analysis.width + x) * 4;
          if (luminance(analysis.data[i], analysis.data[i + 1], analysis.data[i + 2]) <= 242) active += 1;
        }
        profile[y] = active / Math.max(1, endX - startX);
      }
      const smoothed = smoothArray(profile, Math.max(7, Math.round(frameHeight * 0.04)));
      const threshold = Math.max(0.08, percentile(smoothed, 22));
      const mask = closeGaps(Array.from(smoothed, (value) => value > threshold), Math.max(3, Math.round(frameHeight * 0.08)));
      const spans = activeSegments(mask, Math.max(20, Math.round(frameHeight * 0.35)));
      if (!spans.length) return [0, analysis.height];
      return [Math.min(...spans.map(([start]) => start)), Math.max(...spans.map(([, end]) => end))];
    }

    function detectBoxes() {
      const img = state.image;
      const cropMode = $("aspect").value;
      let analysis = analyzeImage(cropMode === "smart-portrait" ? 2600 : 1200);
      const orientationSetting = $("orientation").value;
      const orientation = orientationSetting === "auto"
        ? (imageWidth() >= imageHeight() ? "horizontal" : "vertical")
        : orientationSetting;
      const forcedLanes = $("lanes").value === "auto" ? 0 : Number($("lanes").value) || 1;
      const forcedFrames = Number($("frames").value) || 0;
      const padding = (Number($("padding").value) || 0) / 100;
      const rowGapPercent = Number($("rowGap").value) || 8;
      const boundarySensitivity = Number($("boundarySensitivity").value) || 82;
      const boxes = [];
      let portrait = cropMode === "smart-portrait";

      if (orientation === "horizontal") {
        if (cropMode === "smart-auto") portrait = false;
        const landscape = !portrait;
        const lanes = detectHorizontalLanes(analysis, forcedLanes);
        lanes.forEach(([laneStart, laneEnd]) => {
          const laneHeight = laneEnd - laneStart;
          const cropHeight = laneHeight * 0.9 / analysis.scale;
          const cropWidth = (landscape ? cropHeight * 1.5 : cropHeight / 1.5);
          const frames = forcedFrames || detectedFrameCount(imageWidth(), cropWidth, imageWidth(), lanes.length);
          const pitch = imageWidth() / frames;
          const y = (laneStart + (laneHeight - cropHeight * analysis.scale) / 2) / analysis.scale;
          for (let frame = 0; frame < frames; frame++) {
            const x = frame * pitch + (pitch - cropWidth) / 2;
            boxes.push(makeBox(x, y, cropWidth, cropHeight, boxes.length + 1, padding, img));
          }
        });
      } else {
        let lanes = detectVerticalLanes(analysis, forcedLanes);
        if (cropMode === "smart-auto") {
          portrait = inferVerticalFramePortrait(analysis, lanes, boundarySensitivity);
          if (portrait) {
            analysis = analyzeImage(2600);
            lanes = detectVerticalLanes(analysis, forcedLanes);
          }
        }
        let halfFrameCoarseBoxes = [];
        if (!portrait) {
          halfFrameCoarseBoxes = lanes.map(([laneStart, laneEnd]) =>
            smartHalfFrameBoxes(
              analysis,
              laneStart,
              laneEnd,
              lanes.length,
              forcedFrames,
              rowGapPercent,
              boundarySensitivity
            )
          );
          analysis = analyzeImage(2600);
          lanes = detectVerticalLanes(analysis, forcedLanes);
        }
        const laneBands = lanes.map(([laneStart, laneEnd]) =>
          darkSeparatorBandsForLane(analysis, laneStart, laneEnd, boundarySensitivity)
        );
        lanes.forEach(([laneStart, laneEnd], laneIndex) => {
          if (cropMode === "smart-auto" || cropMode === "smart-landscape" || cropMode === "smart-portrait") {
            const fallbackBands = laneBands.flatMap((bands, index) => index === laneIndex ? [] : bands);
            const detected = portrait
              ? smartFullFrameBoxes(analysis, laneStart, laneEnd, lanes.length, forcedFrames, rowGapPercent, boundarySensitivity, fallbackBands)
              : physicalHalfFrameBoxes(
                  analysis,
                  laneStart,
                  laneEnd,
                  lanes.length,
                  halfFrameCoarseBoxes[laneIndex] || [],
                  rowGapPercent,
                  boundarySensitivity,
                  fallbackBands
                );
            detected.forEach((box) => {
              boxes.push(makeBox(box.x, box.y, box.width, box.height, boxes.length + 1, padding, img));
            });
            return;
          }
        });
        if (lanes.length > 1) {
          boxes.sort((a, b) => (a.y - b.y) || (a.x - b.x));
          boxes.forEach((box, index) => box.order = index + 1);
        }
      }

      state.boxes = boxes;
